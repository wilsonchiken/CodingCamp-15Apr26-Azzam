<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="design.css">
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-name">Budget Tracker</div>
      <div class="brand-sub">Personal Finance</div>
    </div>

    <div class="balance-block">
      <div class="balance-label">Total Balance</div>
      <div id="total-balance">$0.00</div>
    </div>

    <div class="form-block">
      <div class="form-label">New Transaction</div>
      <input type="text"   id="item-name" placeholder="Description" />
      <input type="number" id="amount"    placeholder="Amount" min="0" step="0.01" />
      <select id="category">
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Rent">Rent</option>
      </select>
      <button class="btn-add" onclick="addTransaction()">Add Transaction</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="page-header">
      <div class="page-header-text">
        <h1>Overview</h1>
        <p>A summary of your transactions and spending.</p>
      </div>
      <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">Dark Mode</button>
    </div>

    <div class="stat-row">
      <div class="stat-card s-spent">
        <div class="stat-card-label">Total Spent</div>
        <div class="stat-card-value" id="total-spent">$0.00</div>
      </div>
      <div class="stat-card s-count">
        <div class="stat-card-label">Transactions</div>
        <div class="stat-card-value" id="tx-count">0</div>
      </div>
      <div class="stat-card s-top">
        <div class="stat-card-label">Top Category</div>
        <div class="stat-card-value" id="top-category">—</div>
      </div>
    </div>

    <div class="content-grid">
      <div class="panel">
        <div class="panel-title">Recent Transactions</div>
        <div class="tx-scroll">
          <ul id="transaction-list">
            <li class="empty-msg">No transactions yet.</li>
          </ul>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Spending by Category</div>
        <div class="chart-wrap">
          <canvas id="myChart"></canvas>
        </div>
      </div>
    </div>
  </main>
  <script src="logic.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
